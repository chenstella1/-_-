<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>優華數位英文學習文法刷題網</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        },
                        teal: {
                            600: '#0d9488',
                            700: '#0f766e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #printableWrongArea, #printableWrongArea * { visibility: visible; }
            #printableWrongArea { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-emerald-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 導覽列 Navigation -->
    <nav class="bg-emerald-600 text-white shadow-md sticky top-0 z-50 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-graduation-cap text-2xl text-emerald-200"></i>
                    <span class="font-bold text-xl tracking-wide">優華數位英文學習文法刷題網</span>
                </div>
                <!-- 登入資訊顯示 -->
                <div id="userInfoArea" class="flex items-center gap-4">
                    <!-- JS 動態渲染 -->
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- 登入畫面 -->
        <div id="loginView" class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 border border-emerald-100 text-center my-12">
            <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6 text-emerald-600">
                <i class="fa-solid fa-user-lock text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">學員與管理員登入</h2>
            <p class="text-slate-500 mb-6 text-sm">請輸入您的 Google Gmail 帳號開始刷題</p>
            
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div class="text-left">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Gmail 帳號：</label>
                    <input type="email" id="gmailInput" placeholder="example@gmail.com" required 
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-400 text-sm">
                </div>
                
                <div class="text-left">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">密碼：</label>
                    <input type="password" id="passwordInput" placeholder="管理者請輸入密碼 (學生可留空)" 
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-400 text-sm">
                </div>
                
                <button type="submit" class="w-full flex items-center justify-center gap-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow-sm transition">
                    <i class="fa-solid fa-right-to-bracket"></i> 登入系統
                </button>
            </form>
            <div class="mt-6 text-xs text-slate-400 bg-emerald-50 p-3 rounded-lg text-left space-y-1">
                <span class="font-bold text-emerald-700">登入提示：</span><br>
                • <b>管理者帳號</b>：<code>yhstella2@gmail.com</code> (密碼：<code>a18177300</code>)<br>
                • <b>學生註冊</b>：使用任意 Gmail，需等待管理者審核獲准後即可刷題。
            </div>
        </div>

        <!-- 學生待審核提示視窗 -->
        <div id="pendingView" class="hidden max-w-lg mx-auto bg-white rounded-2xl shadow-xl p-8 border border-amber-200 text-center my-12 space-y-4">
            <div class="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto text-amber-600 text-3xl">
                <i class="fa-solid fa-clock"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800">帳號等待管理者審核中</h3>
            <p class="text-sm text-slate-600 leading-relaxed">
                您的帳號 (<span id="pendingUserEmail" class="font-semibold text-emerald-700"></span>) 已成功送出申請。<br>
                請聯繫管理者 (<code class="text-xs bg-slate-100 px-1 py-0.5 rounded">yhstella2@gmail.com</code>) 核可權限後再進行刷題。
            </p>
            <button onclick="logout()" class="bg-slate-600 hover:bg-slate-700 text-white font-bold py-2 px-6 rounded-lg text-sm
