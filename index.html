<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>優華數位英文學習文法刷題網</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="bg-brand-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">優華數位英文學習文法刷題網</h1>
      <div id="user-status" class="text-sm bg-brand-700 px-3 py-1.5 rounded-full">
        未登入 (預設模式)
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
    
    <!-- 選擇區塊 -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8">
      <h2 class="text-lg font-semibold text-slate-700 mb-4 border-l-4 border-brand-500 pl-3">請選擇練習條件</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">年級</label>
          <select id="grade-select" class="w-full border-slate-300 rounded-lg shadow-sm focus:border-brand-500 focus:ring-brand-500 p-2.5 border">
            <option value="all">全選 / 載入全部</option>
            <option value="國七">國七</option>
            <option value="國八">國八</option>
            <option value="國九">國九</option>
            <option value="高一">高一</option>
            <option value="高二">高二</option>
            <option value="高三">高三</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">文法單元</label>
          <input type="text" id="unit-input" placeholder="可輸入關鍵字或留空" class="w-full border-slate-300 rounded-lg shadow-sm focus:border-brand-500 focus:ring-brand-500 p-2 border">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">測驗題數 (1-100)</label>
          <input type="number" id="question-count" value="10" min="1" max="100" class="w-full border-slate-300 rounded-lg shadow-sm focus:border-brand-500 focus:ring-brand-500 p-2 border">
        </div>
      </div>

      <div class="flex gap-3">
        <button id="btn-fetch" onclick="loadQuestions()" class="bg-brand-600 hover:bg-brand-700 text-white font-medium px-6 py-2.5 rounded-lg transition-colors shadow-sm">
          載入最新題庫
        </button>
        <button id="btn-start" onclick="startQuiz()" class="bg-slate-700 hover:bg-slate-800 text-white font-medium px-6 py-2.5 rounded-lg transition-colors shadow-sm hidden">
          開始測驗
        </button>
      </div>
    </section>

    <!-- 狀態與提示 -->
    <div id="status-msg" class="hidden p-4 mb-6 rounded-lg text-sm"></div>

    <!-- 測驗區域 -->
    <section id="quiz-container" class="hidden space-y-6"></section>

  </main>

  <!-- 腳步版權 -->
  <footer class="bg-slate-100 border-t border-slate-200 py-4 text-center text-xs text-slate-500">
    &copy; 優華數位英文學習文法刷題網 - 自動同步雲端題庫
  </footer>

  <!-- 腳本邏輯 -->
  <script>
    // 直接寫死最新的 Google Sheet ID[cite: 1]
    const SPREADSHEET_ID = '11rFyQ1FLFflBAUzBoJGI2p8EChYSJWuje16DkZZdSWc';
    
    // 使用 gviz/tq 取得公開 JSON 資料
    const GOOGLE_SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

    let allQuestions = [];
    let currentQuiz = [];

    // 顯示訊息
    function showStatus(msg, type = 'info') {
      const el = document.getElementById('status-msg');
      el.classList.remove('hidden', 'bg-blue-50', 'text-blue-700', 'bg-red-50', 'text-red-700', 'bg-green-50', 'text-green-700');
      
      if (type === 'error') {
        el.classList.add('bg-red-50', 'text-red-700');
      } else if (type === 'success') {
        el.classList.add('bg-green-50', 'text-green-700');
      } else {
        el.classList.add('bg-blue-50', 'text-blue-700');
      }
      
      el.innerText = msg;
    }

    // 從 Google Sheet 讀取題目[cite: 1]
    async function loadQuestions() {
      showStatus('連線至 Google Sheet 載入資料中...', 'info');
      try {
        const response = await fetch(GOOGLE_SHEET_URL);
        const text = await response.text();
        
        // 解析 gviz 返回的 JSON 格式
        const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonText);
        
        const rows = data.table.rows;
        if (!rows || rows.length === 0) {
          showStatus(' Google Sheet 讀取成功，但裡面沒有任何題目資料。', 'error');
          return;
        }

        // 解析每列資料 (預設欄位順序: 0:年級, 1:單元, 2:題目, 3:選項A, 4:選項B, 5:選項C, 6:選項D, 7:答案, 8:解析)
        allQuestions = rows.map((r, index) => {
          const c = r.c;
          return {
            id: index + 1,
            grade: c[0] ? c[0].v : '',
            unit: c[1] ? c[1].v : '',
            title: c[2] ? c[2].v : '',
            optionA: c[3] ? c[3].v : '',
            optionB: c[4] ? c[4].v : '',
            optionC: c[5] ? c[5].v : '',
            optionD: c[6] ? c[6].v : '',
            answer: c[7] ? String(c[7].v).trim().toUpperCase() : '',
            analysis: c[8] ? c[8].v : ''
          };
        }).filter(q => q.title); // 過濾掉空行

        showStatus(`成功載入 ${allQuestions.length} 題題庫！請點擊「開始測驗」。`, 'success');
        document.getElementById('btn-start').classList.remove('hidden');

      } catch (err) {
        console.error(err);
        showStatus(' 載入失敗！請確認該 Google Sheet 是否已開啟「知道連結的任何人皆可檢視」權限。', 'error');
      }
    }

    // 開始出題測驗
    function startQuiz() {
      const selectedGrade = document.getElementById('grade-select').value;
      const unitKeyword = document.getElementById('unit-input').value.trim();
      const count = parseInt(document.getElementById('question-count').value) || 10;

      // 條件篩選
      let filtered = allQuestions;
      if (selectedGrade !== 'all') {
        filtered = filtered.filter(q => String(q.grade) === selectedGrade);
      }
      if (unitKeyword) {
        filtered = filtered.filter(q => String(q.unit).includes(unitKeyword));
      }

      if (filtered.length === 0) {
        showStatus('找不到符合此年級/單元條件的題目，請重新調整篩選條件。', 'error');
        return;
      }

      // 隨機抽題
      currentQuiz = [...filtered].sort(() => 0.5 - Math.random()).slice(0, count);

      // 渲染題目列表
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';
      container.classList.remove('hidden');

      currentQuiz.forEach((q, idx) => {
        const qCard = document.createElement('div');
        qCard.className = "bg-white p-6 rounded-xl shadow-sm border border-slate-200";
        qCard.innerHTML = `
          <div class="font-medium text-slate-800 mb-3">
            <span class="inline-block bg-brand-100 text-brand-700 text-xs px-2 py-0.5 rounded mr-2">第 ${idx + 1} 題 / ${q.grade || '綜合'}</span>
            ${q.title}
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm text-slate-700">
            <label class="p-2.5 rounded border border-slate-200 hover:bg-slate-50 cursor-pointer flex items-center">
              <input type="radio" name="q_${q.id}" value="A" class="mr-2 text-brand-600 focus:ring-brand-500"> A. ${q.optionA}
            </label>
            <label class="p-2.5 rounded border border-slate-200 hover:bg-slate-50 cursor-pointer flex items-center">
              <input type="radio" name="q_${q.id}" value="B" class="mr-2 text-brand-600 focus:ring-brand-500"> B. ${q.optionB}
            </label>
            <label class="p-2.5 rounded border border-slate-200 hover:bg-slate-50 cursor-pointer flex items-center">
              <input type="radio" name="q_${q.id}" value="C" class="mr-2 text-brand-600 focus:ring-brand-500"> C. ${q.optionC}
            </label>
            <label class="p-2.5 rounded border border-slate-200 hover:bg-slate-50 cursor-pointer flex items-center">
              <input type="radio" name="q_${q.id}" value="D" class="mr-2 text-brand-600 focus:ring-brand-500"> D. ${q.optionD}
            </label>
          </div>
        `;
        container.appendChild(qCard);
      });

      showStatus(`已為您隨機抽出 ${currentQuiz.length} 題，請開始作答！`, 'success');
    }
  </script>
</body>
</html>
