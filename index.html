<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>優華數位刷題網</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2pdf.js 支援錯題本與試卷轉成 PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>
  <style>
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: #fff !important; color: #000 !important; }
      .card-box { border: 1px solid #ccc !important; box-shadow: none !important; margin-bottom: 20px !important; break-inside: avoid; }
      .page-break { page-break-before: always; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans text-base">

  <!-- 登入畫面 (Modal) -->
  <div id="login-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 border border-slate-100">
      <div class="text-center mb-6">
        <h2 class="text-3xl font-black text-slate-800">優華數位刷題網</h2>
        <p class="text-sm text-slate-500 mt-2">學生請用 Email 登入，密碼請洽老師</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5 uppercase tracking-wider">電子郵件 (Email)</label>
          <input type="email" id="login-email" required placeholder="name@example.com" class="w-full border border-slate-300 rounded-xl p-3.5 text-base focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5 uppercase tracking-wider">登入密碼</label>
          <input type="password" id="login-pass" required placeholder="請輸入密碼" class="w-full border border-slate-300 rounded-xl p-3.5 text-base focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 rounded-xl transition-colors shadow-lg text-base mt-3">
          立即登入系統
        </button>
      </form>
    </div>
  </div>

  <!-- 頂部導覽列 -->
  <header class="bg-brand-600 text-white shadow-md no-print">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-3xl font-black tracking-wider drop-shadow-sm">優華數位刷題網</span>
      </div>
      <div class="flex items-center gap-4">
        <span id="user-status" class="text-sm bg-brand-700 px-3.5 py-1.5 rounded-full font-medium">未登入</span>
        <button id="nav-home-btn" onclick="switchTab('quiz')" class="text-sm font-bold hover:underline">主頁測驗</button>
        <button onclick="logout()" class="text-sm text-brand-100 hover:text-white underline">登出</button>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
    
    <!-- 管理者介面 (Admin Dashboard) -->
    <div id="tab-admin" class="hidden space-y-6">
      <div class="bg-white p-7 rounded-3xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-800 mb-2">🛡️ 管理者後台：學生刷題與錯題檢視</h2>
        <p class="text-sm text-slate-500 mb-6">在此可檢視所有學生的使用帳號、各次刷題題數、答錯題數、刷題單元範圍，並可點開查看錯題詳情或寄送 Feedback。</p>
        
        <div id="admin-students-list" class="space-y-4">
          <!-- 動態載入學生列表與錯題明細 -->
        </div>
      </div>
    </div>

    <!-- 學生側：錯題本按鈕區 -->
    <div id="wrong-btn-banner" class="mb-6 no-print">
      <button onclick="switchTab('wrong-notebook')" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-bold py-4 px-6 rounded-2xl shadow-md transition-all flex items-center justify-between text-lg">
        <div class="flex items-center gap-3">
          <span class="text-2xl">📚</span>
          <span>查看我的專屬錯題本與複習講義 (自動同步雲端紀錄)</span>
        </div>
        <span id="wrong-count-badge" class="bg-red-600 text-white text-sm px-3 py-1 rounded-full shadow hidden">0 題</span>
      </button>
    </div>

    <!-- 頁籤一：測驗與出題主頁 (含個人月曆) -->
    <div id="tab-quiz" class="space-y-6">
      
      <!-- 個人刷題打卡月曆區 -->
      <section class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 no-print">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <span>📅 個人刷題打卡月曆</span>
            <span class="text-xs font-normal text-slate-500">(單日累積答對 10 題以上自動點亮 ⭐)</span>
          </h3>
          <div class="flex items-center gap-2">
            <button onclick="changeMonth(-1)" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-bold">&lt;</button>
            <span id="calendar-month-title" class="font-bold text-slate-700 text-base">2026年 6月</span>
            <button onclick="changeMonth(1)" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-bold">&gt;</button>
          </div>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs text-slate-400 mb-2">
          <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 text-sm">
          <!-- 動態生成月曆格子 -->
        </div>
      </section>

      <!-- 條件設定面板 -->
      <section class="bg-white p-7 rounded-3xl shadow-sm border border-slate-200 no-print">
        <h2 class="text-lg font-bold text-slate-800 mb-5 border-l-4 border-brand-500 pl-3 flex items-center justify-between">
          <span>題目選擇與過濾條件</span>
          <button onclick="loadQuestions()" class="text-sm font-normal text-brand-600 hover:underline">🔄 重新同步 Google Sheet 題庫</button>
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
          
          <!-- 年級單選區 -->
          <div class="md:col-span-6 border-r border-slate-100 pr-0 md:pr-4">
            <label class="block text-sm font-semibold text-slate-600 uppercase tracking-wider mb-2.5">1. 選擇年級</label>
            <div id="grade-radioes" class="grid grid-cols-2 gap-2.5 text-sm">
              <span class="text-slate-400 text-xs">正在載入年級選項...</span>
            </div>
          </div>

          <!-- 學習類別複選區 -->
          <div class="md:col-span-4 border-r border-slate-100 pr-0 md:pr-4">
            <label class="block text-sm font-semibold text-slate-600 uppercase tracking-wider mb-2.5">2. 學習類別 (可複選多個)</label>
            <div id="category-checkboxes" class="space-y-2 text-sm max-h-48 overflow-y-auto pr-1">
              <span class="text-slate-400 text-xs">請先選擇年級</span>
            </div>
          </div>

          <!-- 題數 -->
          <div class="md:col-span-2 space-y-4">
            <div>
              <label class="block text-sm font-semibold text-slate-600 uppercase tracking-wider mb-1.5">3. 題數</label>
              <input type="number" id="question-count" value="10" min="1" max="100" class="w-full border-slate-200 rounded-xl text-base p-3 border font-medium">
            </div>
          </div>

        </div>

        <!-- 模式按鈕選擇 -->
        <div class="mt-6 pt-5 border-t border-slate-100 flex flex-wrap gap-4">
          <button onclick="startQuiz('online')" class="bg-brand-600 hover:bg-brand-700 text-white text-base font-bold px-6 py-3 rounded-xl shadow-md flex items-center gap-2">
            🚀 線上練習 (亂數出題 + 即時解析)
          </button>
          <button onclick="startQuiz('print')" class="bg-slate-800 hover:bg-slate-900 text-white text-base font-bold px-6 py-3 rounded-xl shadow-md flex items-center gap-2">
            🖨️ 生成可列印試卷及答案解析 (列印/PDF)
          </button>
        </div>

      </section>

      <!-- 狀態提示 -->
      <div id="status-msg" class="p-4 rounded-2xl text-base border hidden no-print"></div>

      <!-- 測驗與試卷展示區 -->
      <section id="quiz-container" class="space-y-5"></section>
      
      <!-- 線上測驗交卷/寄給老師按鈕區 -->
      <div id="quiz-finish-actions" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center space-y-3 no-print">
        <p class="text-sm font-bold text-slate-600">測驗題目已全部作答完成！您可以將成績與錯題傳送給老師。</p>
        <button onclick="sendScoreToTeacher()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-lg font-bold px-8 py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 mx-auto">
          📤 成績寄給老師 (englisheasy88@gmail.com)
        </button>
      </div>
      
      <!-- 試卷列印控制按鈕區 -->
      <div id="print-actions" class="hidden flex gap-3 justify-end no-print">
        <button onclick="window.print()" class="bg-slate-700 text-white px-5 py-2.5 rounded-xl text-base font-bold">直接列印試卷與答案解析</button>
        <button onclick="exportToPDF('quiz-container', '英文試卷與解答')" class="bg-brand-600 text-white px-5 py-2.5 rounded-xl text-base font-bold">下載 PDF 試卷與解答</button>
      </div>

    </div>

    <!-- 頁籤二 : 錯題區本 -->
    <div id="tab-wrong" class="hidden space-y-5">
      <div class="bg-white p-7 rounded-3xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4 no-print">
        <div>
          <h2 class="text-xl font-bold text-slate-800">專屬錯題複習區</h2>
          <p class="text-sm text-slate-500 mt-1">自動收集答錯的題目，隨時跨裝置同步，支援一鍵列印或導出為 PDF 講義。</p>
        </div>
        <div class="flex gap-2.5">
          <button onclick="switchTab('quiz')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-bold px-4 py-2.5 rounded-xl">返回主頁測驗</button>
          <button onclick="exportToPDF('wrong-list-container', '英文錯題本')" class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold px-4 py-2.5 rounded-xl">匯出錯題本 PDF</button>
          <button onclick="window.print()" class="bg-slate-700 text-white text-sm font-bold px-4 py-2.5 rounded-xl">列印錯題講義</button>
          <button onclick="clearWrongQuestions()" class="bg-red-50 text-red-600 hover:bg-red-100 text-sm font-bold px-4 py-2.5 rounded-xl border border-red-200">清空</button>
        </div>
      </div>

      <div id="wrong-list-container" class="space-y-5"></div>
    </div>

  </main>

  <script>
    const SPREADSHEET_ID = '11rFyQ1FLFflBAUzBoJGI2p8EChYSJWuje16DkZZdSWc';
    const GOOGLE_SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

    let currentUser = null;
    let rawQuestions = [];
    let wrongQuestions = [];
    let userLogs = [];
    let currentCalendarDate = new Date();

    window.onload = () => {
      const savedUser = localStorage.getItem('yh_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('user-status').innerText = `👤 ${currentUser.email}`;
        
        if (currentUser.email === 'yhstella2@gmail.com') {
          // 管理者模式
          document.getElementById('tab-admin').classList.remove('hidden');
          document.getElementById('tab-quiz').classList.add('hidden');
          document.getElementById('wrong-btn-banner').classList.add('hidden');
          document.getElementById('nav-home-btn').innerText = '管理者後台';
          loadAdminDashboard();
        } else {
          // 學生模式
          loadUserWrongQuestions();
          loadUserLogs();
          renderCalendar();
          loadQuestions();
        }
      }
    };

    function loadUserWrongQuestions() {
      if (!currentUser) return;
      const storageKey = `yh_wrong_${currentUser.email}`;
      wrongQuestions = JSON.parse(localStorage.getItem(storageKey) || '[]');
      updateWrongBadge();
    }

    function saveUserWrongQuestions() {
      if (!currentUser) return;
      const storageKey = `yh_wrong_${currentUser.email}`;
      localStorage.setItem(storageKey, JSON.stringify(wrongQuestions));
      updateWrongBadge();

      let allStudents = JSON.parse(localStorage.getItem('yh_all_students') || '{}');
      if (!allStudents[currentUser.email]) {
        allStudents[currentUser.email] = { email: currentUser.email, logs: [], wrongs: [] };
      }
      allStudents[currentUser.email].wrongs = wrongQuestions;
      localStorage.setItem('yh_all_students', JSON.stringify(allStudents));
    }

    function loadUserLogs() {
      if (!currentUser) return;
      const storageKey = `yh_logs_${currentUser.email}`;
      userLogs = JSON.parse(localStorage.getItem(storageKey) || '[]');
    }

    function recordQuizSession(totalCount, correctCount, wrongCount, rangeText, sessionWrongItems = []) {
      if (!currentUser || currentUser.email === 'yhstella2@gmail.com') return;

      const todayStr = new Date().toISOString().split('T')[0];
      const storageKey = `yh_logs_${currentUser.email}`;
      let logs = JSON.parse(localStorage.getItem(storageKey) || '[]');
      
      const sessionData = {
        date: todayStr,
        timestamp: new Date().toLocaleString(),
        total: totalCount,
        correct: correctCount,
        wrong: wrongCount,
        range: rangeText,
        wrongItems: sessionWrongItems
      };

      logs.push(sessionData);
      localStorage.setItem(storageKey, JSON.stringify(logs));

      let allStudents = JSON.parse(localStorage.getItem('yh_all_students') || '{}');
      if (!allStudents[currentUser.email]) {
        allStudents[currentUser.email] = { email: currentUser.email, logs: [], wrongs: wrongQuestions };
      }
      allStudents[currentUser.email].logs = logs;
      localStorage.setItem('yh_all_students', JSON.stringify(allStudents));

      loadUserLogs();
      renderCalendar();
      return sessionData;
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const pass = document.getElementById('login-pass').value.trim();

      if (!email || !pass) {
        alert('請完整輸入 Email 與密碼');
        return;
      }

      currentUser = { email };
      localStorage.setItem('yh_user', JSON.stringify(currentUser));
      document.getElementById('login-modal').classList.add('hidden');
      document.getElementById('user-status').innerText = `👤 ${email}`;
      
      let allStudents = JSON.parse(localStorage.getItem('yh_all_students') || '{}');
      if (!allStudents[email]) {
        allStudents[email] = { email: email, logs: [], wrongs: JSON.parse(localStorage.getItem(`yh_wrong_${email}`) || '[]') };
        localStorage.setItem('yh_all_students', JSON.stringify(allStudents));
      }

      if (email === 'yhstella2@gmail.com') {
        document.getElementById('tab-admin').classList.remove('hidden');
        document.getElementById('tab-quiz').classList.add('hidden');
        document.getElementById('wrong-btn-banner').classList.add('hidden');
        document.getElementById('nav-home-btn').innerText = '管理者後台';
        loadAdminDashboard();
      } else {
        loadUserWrongQuestions();
        loadUserLogs();
        renderCalendar();
        loadQuestions();
      }
    }

    function logout() {
      localStorage.removeItem('yh_user');
      location.reload();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      const title = document.getElementById('calendar-month-title');
      grid.innerHTML = '';

      const year = currentCalendarDate.getFullYear();
      const month = currentCalendarDate.getMonth();
      title.innerText = `${year}年 ${month + 1}月`;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      let dailyCorrectCounts = {};
      userLogs.forEach(log => {
        dailyCorrectCounts[log.date] = (dailyCorrectCounts[log.date] || 0) + log.correct;
      });

      for (let i = 0; i < firstDayIndex; i++) {
        grid.innerHTML += `<div></div>`;
      }

      for (let day = 1; day <= totalDays; day++) {
        const mStr = String(month + 1).padStart(2, '0');
        const dStr = String(day).padStart(2, '0');
        const dateKey = `${year}-${mStr}-${dStr}`;
        const correctCount = dailyCorrectCounts[dateKey] || 0;
        const hasStar = correctCount >= 10;

        grid.innerHTML += `
          <div class="h-14 border border-slate-100 rounded-xl p-1.5 flex flex-col justify-between items-center bg-slate-50 relative">
            <span class="text-xs font-semibold text-slate-700">${day}</span>
            <div class="flex flex-col items-center">
              ${hasStar ? '<span class="text-base drop-shadow">⭐</span>' : ''}
              ${correctCount > 0 ? `<span class="text-[10px] text-brand-700 font-bold">答對${correctCount}題</span>` : '<span class="text-[10px] text-slate-300">-</span>'}
            </div>
          </div>
        `;
      }
    }

    function changeMonth(direction) {
      currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
      renderCalendar();
    }

    function loadAdminDashboard() {
      const container = document.getElementById('admin-students-list');
      const allStudents = JSON.parse(localStorage.getItem('yh_all_students') || '{}');
      const studentEmails = Object.keys(allStudents);

      if (studentEmails.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-400 bg-slate-50 rounded-2xl">目前尚無學生的刷題打卡紀錄。</div>`;
        return;
      }

      container.innerHTML = studentEmails.map((email, index) => {
        const st = allStudents[email];
        const logs = st.logs || [];
        const wrongs = st.wrongs || [];

        const logsHtml = logs.length > 0 ? logs.map(l => `
          <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-xs flex justify-between items-center mb-1.5">
            <div>
              <span class="font-bold text-slate-800">📅 ${l.date}</span> 
              <span class="text-brand-700 font-bold ml-2">刷題共 ${l.total} 題</span>
              <span class="text-green-700 font-bold ml-2">答對 ${l.correct} 題</span>
              <span class="text-red-600 font-bold ml-2">錯 ${l.wrong} 題</span>
              <div class="text-slate-500 mt-0.5">刷題單元範圍：${l.range}</div>
            </div>
            <span class="text-slate-400">${l.timestamp}</span>
          </div>
        `).join('') : '<div class="text-xs text-slate-400 italic">尚無刷題紀錄</div>';

        const wrongsHtml = wrongs.length > 0 ? wrongs.map((w, wIdx) => `
          <div class="bg-red-50/50 p-3 rounded-xl border border-red-100 text-xs space-y-1 mb-2">
            <div class="font-bold text-red-700">錯題 #${wIdx + 1} (${w.grade} / ${w.category})</div>
            <div class="font-bold text-slate-800">${w.title}</div>
            <div class="text-slate-600 pl-2">
              <div>(A) ${w.optionA}</div>
              <div>(B) ${w.optionB}</div>
              <div>(C) ${w.optionC}</div>
              <div>(D) ${w.optionD}</div>
            </div>
            <div class="text-brand-700 font-bold">正確答案：(${w.answer}) | 解析：${w.analysis}</div>
          </div>
        `).join('') : '<div class="text-xs text-slate-400 italic">該學生目前沒有錯題紀錄</div>';

        const wrongBoxId = `wrong_box_${index}`;

        return `
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div class="flex justify-between items-center flex-wrap gap-2">
              <div>
                <span class="text-base font-bold text-slate-800">📧 學生 Email：${email}</span>
                <span class="ml-3 text-xs bg-brand-100 text-brand-700 px-2.5 py-1 rounded-full font-bold">總練習次數：${logs.length} 次</span>
                <span class="ml-2 text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-bold">錯題本累積：${wrongs.length} 題</span>
              </div>
              <button onclick="document.getElementById('${wrongBoxId}').classList.toggle('hidden')" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow">
                👁️ 點開看錯題 (${wrongs.length}題)
              </button>
            </div>
            
            <div class="space-y-1">
              <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">刷題紀錄明細 (題數、錯題數與範圍)：</div>
              <div class="max-h-40 overflow-y-auto pr-2 space-y-1">${logsHtml}</div>
            </div>

            <div id="${wrongBoxId}" class="hidden pt-3 border-t border-slate-100 space-y-2">
              <div class="text-xs font-bold text-red-600 uppercase tracking-wider">該學生的錯題詳情清單：</div>
              <div class="max-h-60 overflow-y-auto pr-2 space-y-2">${wrongsHtml}</div>
            </div>

            <div class="pt-3 border-t border-slate-100 space-y-2">
              <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">給學生寫 Feedback (透過 Gmail 發送至學生信箱)</label>
              <textarea id="feedback-msg-${email.replace(/[@.]/g, '_')}" rows="2" placeholder="請輸入給該學生的鼓勵或指導評語..." class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none"></textarea>
              <div class="flex justify-end">
                <button onclick="sendFeedbackEmail('${email}')" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow">
                  ✉️ 發送 Feedback 郵件
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function sendFeedbackEmail(studentEmail) {
      const inputId = `feedback-msg-${studentEmail.replace(/[@.]/g, '_')}`;
      const message = document.getElementById(inputId).value.trim();

      if (!message) {
        alert('請先輸入 Feedback 內容再發送！');
        return;
      }

      const subject = "【優華數位刷題網】老師給您的學習回饋 (Feedback)";
      window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(studentEmail)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`, '_blank');
      alert(`已為您開啟 Gmail 準備發送 Feedback 給 ${studentEmail}！`);
    }

    async function loadQuestions() {
      showStatus('連線至 Google Sheet 載入題庫中...', 'info');
      try {
        const res = await fetch(GOOGLE_SHEET_URL);
        const text = await res.text();
        const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonText);
        
        const rows = data.table.rows || [];
        rawQuestions = rows.map((r, idx) => {
          const c = r.c || [];
          return {
            id: idx + 1,
            grade: c[1] ? String(c[1].v).trim() : '',       // B 欄: 年級
            category: c[2] ? String(c[2].v).trim() : '',    // C 欄: 學習類別
            title: c[3] ? String(c[3].v).trim() : '',       // D 欄: 題目
            optionA: c[4] ? String(c[4].v) : '',            // E 欄: A
            optionB: c[5] ? String(c[5].v) : '',            // F 欄: B
            optionC: c[6] ? String(c[6].v) : '',            // G 欄: C
            optionD: c[7] ? String(c[7].v) : '',            // H 欄: D
            answer: c[8] ? String(c[8].v).trim().toUpperCase() : '', // I 欄: 答案
            analysis: c[9] ? String(c[9].v) : '暫無詳細解析'   // J 欄: 解析
          };
        }).filter(q => q.title);

        renderGradeRadios();
        showStatus(`成功載入 ${rawQuestions.length} 筆試題！`, 'success');
      } catch (err) {
        showStatus('題庫讀取失敗，請確認 Google Sheet 是否已開啟公開檢視權限。', 'error');
      }
    }

    function renderGradeRadios() {
      const grades = [...new Set(rawQuestions.map(q => q.grade).filter(Boolean))];
      const gradeContainer = document.getElementById('grade-radioes');
      
      if (grades.length === 0) {
        gradeContainer.innerHTML = '<span class="text-slate-400 text-xs">B 欄無資料</span>';
        return;
      }

      gradeContainer.innerHTML = grades.map((g, idx) => {
        const count = rawQuestions.filter(q => q.grade === g).length;
        const checked = idx === 0 ? 'checked' : '';
        return `
          <label class="flex items-center gap-2 p-2 rounded-xl bg-slate-50 hover:bg-slate-100 cursor-pointer font-medium">
            <input type="radio" name="grade-radio" value="${g}" ${checked} onchange="onGradeChange()" class="text-brand-600 w-4 h-4"> 
            <span>${g}</span> 
            <span class="text-xs text-slate-400 ml-auto">(題數共: ${count}題)</span>
          </label>
        `;
      }).join('');

      onGradeChange();
    }

    function onGradeChange() {
      const selectedGradeInput = document.querySelector('input[name="grade-radio"]:checked');
      if (!selectedGradeInput) return;

      const selectedGrade = selectedGradeInput.value;
      const gradeQuestions = rawQuestions.filter(q => q.grade === selectedGrade);
      
      const categories = [...new Set(gradeQuestions.map(q => q.category).filter(Boolean))];
      const categoryContainer = document.getElementById('category-checkboxes');

      if (categories.length === 0) {
        categoryContainer.innerHTML = '<span class="text-slate-400 text-xs">此年級無學習類別資料</span>';
        return;
      }

      categoryContainer.innerHTML = categories.map(cat => {
        const count = gradeQuestions.filter(q => q.category === cat).length;
        return `
          <label class="flex items-center gap-2 p-2 rounded-xl bg-slate-50 hover:bg-slate-100 cursor-pointer font-medium">
            <input type="checkbox" value="${cat}" class="category-cb text-brand-600 rounded w-4 h-4" checked> 
            <span>${cat}</span> 
            <span class="text-xs text-slate-400 ml-auto">(題數共: ${count}題)</span>
          </label>
        `;
      }).join('');
    }

    function getFilteredQuestions() {
      const selectedGradeInput = document.querySelector('input[name="grade-radio"]:checked');
      const selectedGrade = selectedGradeInput ? selectedGradeInput.value : '';
      const selectedCategories = Array.from(document.querySelectorAll('.category-cb:checked')).map(cb => cb.value);

      return rawQuestions.filter(q => {
        if (q.grade !== selectedGrade) return false;
        if (selectedCategories.length > 0 && !selectedCategories.includes(q.category)) return false;
        return true;
      });
    }

    function startQuiz(mode) {
      const filtered = getFilteredQuestions();
      const count = parseInt(document.getElementById('question-count').value) || 10;

      if (filtered.length === 0) {
        showStatus('找不到符合條件的題目，請至少勾選一項學習類別！', 'error');
        return;
      }

      const quizQuestions = [...filtered].sort(() => 0.5 - Math.random()).slice(0, count);
      const container = document.getElementById('quiz-container');
      const actionBox = document.getElementById('print-actions');
      const finishBox = document.getElementById('quiz-finish-actions');
      container.innerHTML = '';

      if (mode === 'online') {
        actionBox.classList.add('hidden');
        finishBox.classList.add('hidden');
        renderOnlineQuiz(container, quizQuestions);
        showStatus(`已挑選 ${quizQuestions.length} 題，請點擊選項作答。`, 'success');
      } else {
        finishBox.classList.add('hidden');
        actionBox.classList.remove('hidden');
        renderPrintableQuizAndAnswers(container, quizQuestions);
        
        const selectedGradeInput = document.querySelector('input[name="grade-radio"]:checked');
        const gradeName = selectedGradeInput ? selectedGradeInput.value : '';
        const selectedCategories = Array.from(document.querySelectorAll('.category-cb:checked')).map(cb => cb.value).join(', ');
        recordQuizSession(quizQuestions.length, 0, 0, `${gradeName} / [${selectedCategories}] (列印試卷)`);

        showStatus(`已產出 ${quizQuestions.length} 題的空白試卷與解答解析，可直接列印或匯出 PDF。`, 'success');
      }
    }

    function renderOnlineQuiz(container, questions) {
      window.currentQuizSession = {
        total: questions.length,
        correct: 0,
        wrong: 0,
        answeredCount: 0,
        wrongItems: [],
        rangeText: (() => {
          const g = document.querySelector('input[name="grade-radio"]:checked')?.value || '';
          const cats = Array.from(document.querySelectorAll('.category-cb:checked')).map(cb => cb.value).join(', ');
          return `${g} / [${cats}]`;
        })()
      };

      questions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = "bg-white p-6 rounded-3xl shadow-sm border border-slate-200 card-box";
        card.innerHTML = `
          <div class="flex items-center gap-2 mb-3">
            <span class="bg-brand-100 text-brand-700 text-sm px-3 py-1 rounded-full font-bold">第 ${idx + 1} 題</span>
            <span class="text-sm bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg font-medium">${q.grade} / ${q.category}</span>
          </div>
          <div class="text-slate-900 font-bold mb-4 text-lg">${q.title}</div>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-base mb-4">
            ${['A', 'B', 'C', 'D'].map(opt => `
              <button onclick="checkAnswer(${q.id}, '${opt}', '${q.answer}', '${q.grade}', '${q.category}')" 
                class="opt-btn-${q.id} w-full text-left p-3.5 rounded-2xl border border-slate-200 hover:bg-slate-50 transition-all font-medium flex items-center justify-between">
                <span><strong class="text-slate-400 mr-2">${opt}.</strong> ${q[`option${opt}`]}</span>
              </button>
            `).join('')}
          </div>

          <div id="feedback-${q.id}" class="hidden p-4 rounded-2xl text-base border space-y-1.5"></div>
        `;
        container.appendChild(card);
      });
    }

    function checkAnswer(qId, selectedOpt, correctOpt, grade, category) {
      const q = rawQuestions.find(item => item.id === qId);
      const feedbackEl = document.getElementById(`feedback-${qId}`);
      const buttons = document.querySelectorAll(`.opt-btn-${qId}`);

      buttons.forEach(btn => btn.disabled = true);
      const isCorrect = selectedOpt === correctOpt;

      if (isCorrect) {
        feedbackEl.className = "p-4 rounded-2xl text-base border bg-green-50 border-green-200 text-green-900 font-medium";
        feedbackEl.innerHTML = `
          <div class="font-bold text-green-700 mb-1">✅ 回答正確！</div>
          <div><strong>正確答案：</strong> (${correctOpt})</div>
          <div class="text-sm text-green-950 mt-1"><strong>【解析】</strong> ${q.analysis}</div>
        `;
        if (window.currentQuizSession) window.currentQuizSession.correct++;
      } else {
        feedbackEl.className = "p-4 rounded-2xl text-base border bg-red-50 border-red-200 text-red-900 font-medium";
        feedbackEl.innerHTML = `
          <div class="font-bold text-red-700 mb-1">❌ 回答錯誤 (已自動收錄至錯題區)</div>
          <div><strong>您的選擇：</strong> ${selectedOpt} | <strong>正確答案：</strong> (${correctOpt})</div>
          <div class="text-sm text-red-950 mt-1"><strong>【解析】</strong> ${q.analysis}</div>
        `;
        if (window.currentQuizSession) {
          window.currentQuizSession.wrong++;
          window.currentQuizSession.wrongItems.push(q);
        }
        addWrongQuestion(q);
      }

      feedbackEl.classList.remove('hidden');

      if (window.currentQuizSession) {
        window.currentQuizSession.answeredCount++;
        if (window.currentQuizSession.answeredCount === window.currentQuizSession.total) {
          recordQuizSession(
            window.currentQuizSession.total, 
            window.currentQuizSession.correct, 
            window.currentQuizSession.wrong, 
            window.currentQuizSession.rangeText,
            window.currentQuizSession.wrongItems
          );
          document.getElementById('quiz-finish-actions').classList.remove('hidden');
        }
      }
    }

    function sendScoreToTeacher() {
      if (!window.currentQuizSession) return;
      const session = window.currentQuizSession;
      const studentEmail = currentUser ? currentUser.email : '未登入學生';

      let bodyText = `報告老師，我是學生 (${studentEmail})。\n`;
      bodyText += `我剛剛完成了線上刷題測驗，以下是我的成績與錯題內容：\n\n`;
      bodyText += `【刷題統計】\n`;
      bodyText += `• 刷題範圍：${session.rangeText}\n`;
      bodyText += `• 總刷題數：${session.total} 題\n`;
      bodyText += `• 答對題數：${session.correct} 題\n`;
      bodyText += `• 答錯題數：${session.wrong} 題\n\n`;

      if (session.wrongItems.length > 0) {
        bodyText += `【錯題內容詳情】\n`;
        session.wrongItems.forEach((w, idx) => {
          bodyText += `----------------------------------------\n`;
          bodyText += `錯題 ${idx + 1}：${w.title}\n`;
          bodyText += `(A) ${w.optionA} | (B) ${w.optionB} | (C) ${w.optionC} | (D) ${w.optionD}\n`;
          bodyText += `正確答案：(${w.answer}) | 解析：${w.analysis}\n`;
        });
      } else {
        bodyText += `【錯題內容詳情】\n太棒了！本次測驗全數答對，沒有錯題！\n`;
      }

      const subject = `【學生刷題成績回報】 ${studentEmail} (刷${session.total}題 / 錯${session.wrong}題)`;
      const mailtoUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=englisheasy88@gmail.com&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyText)}`;
      
      window.open(mailtoUrl, '_blank');
      alert('成績已寄, 你很棒! 🎉');
    }

    function renderPrintableQuizAndAnswers(container, questions) {
      // 試卷區 (不顯示 C 欄學習類別)
      const paper = document.createElement('div');
      paper.className = "bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6";
      paper.innerHTML = `
        <div class="text-center border-b pb-4 mb-6">
          <h1 class="text-2xl font-black">優華數位測驗卷</h1>
          <p class="text-sm text-slate-500 mt-1.5">班級：________ 姓名：________ 座號：________ 得分：________</p>
        </div>
        ${questions.map((q, idx) => `
          <div class="space-y-2.5 break-inside-avoid">
            <div class="font-bold text-slate-900 text-base">
              ${idx + 1}. ${q.title}
            </div>
            <div class="grid grid-cols-2 gap-x-8 gap-y-1.5 text-sm pl-4 font-medium">
              <div>(A) ${q.optionA}</div>
              <div>(B) ${q.optionB}</div>
              <div>(C) ${q.optionC}</div>
              <div>(D) ${q.optionD}</div>
            </div>
          </div>
        `).join('')}
      `;
      container.appendChild(paper);

      // 解答區 (不顯示 C 欄學習類別)
      const answerSheet = document.createElement('div');
      answerSheet.className = "bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6 page-break mt-8";
      answerSheet.innerHTML = `
        <div class="text-center border-b pb-4 mb-6">
          <h1 class="text-2xl font-black text-brand-700">優華數位測驗卷 - 標準答案與詳細解析</h1>
          <p class="text-sm text-slate-500 mt-1.5">教師參考用卷</p>
        </div>
        ${questions.map((q, idx) => `
          <div class="space-y-2 break-inside-avoid border-b border-slate-100 pb-4">
            <div class="font-bold text-slate-900 text-sm">
              第 ${idx + 1} 題：${q.title}
            </div>
            <div class="text-xs text-brand-700 font-bold">
              正確答案：(${q.answer})
            </div>
            <div class="text-xs text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-100">
              <strong>解析：</strong>${q.analysis}
            </div>
          </div>
        `).join('')}
      `;
      container.appendChild(answerSheet);
    }

    function addWrongQuestion(q) {
      if (!wrongQuestions.some(item => item.id === q.id)) {
        wrongQuestions.push(q);
        saveUserWrongQuestions();
        renderWrongNotebook();
      }
    }

    function renderWrongNotebook() {
      const container = document.getElementById('wrong-list-container');
      if (wrongQuestions.length === 0) {
        container.innerHTML = `<div class="bg-white p-10 rounded-3xl text-center text-slate-400 text-base">目前沒有任何錯題紀錄！</div>`;
        return;
      }

      container.innerHTML = wrongQuestions.map((q, idx) => `
        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm card-box">
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm font-bold text-red-600 bg-red-50 px-3 py-1 rounded-full">錯題 #${idx + 1}</span>
            <span class="text-sm text-slate-500 font-medium">${q.grade} / ${q.category}</span>
          </div>
          <div class="font-bold text-slate-900 mb-3 text-base">${q.title}</div>
          <div class="text-sm text-slate-700 space-y-1 mb-4 pl-3 border-l-4 border-slate-200 font-medium">
            <div>(A) ${q.optionA}</div>
            <div>(B) ${q.optionB}</div>
            <div>(C) ${q.optionC}</div>
            <div>(D) ${q.optionD}</div>
          </div>
          <div class="bg-slate-50 p-4 rounded-2xl text-sm border border-slate-100">
            <span class="font-bold text-brand-700">正確答案：(${q.answer})</span>
            <p class="text-slate-700 mt-1.5"><strong>解析：</strong>${q.analysis}</p>
          </div>
        </div>
      `).join('');
    }

    function clearWrongQuestions() {
      if (confirm('確定要清空錯題區的所有紀錄嗎？')) {
        wrongQuestions = [];
        saveUserWrongQuestions();
        renderWrongNotebook();
      }
    }

    function updateWrongBadge() {
      const badge = document.getElementById('wrong-count-badge');
      if (wrongQuestions.length > 0) {
        badge.innerText = `${wrongQuestions.length} 題`;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function switchTab(tab) {
      if (currentUser && currentUser.email === 'yhstella2@gmail.com') return;
      if (tab === 'quiz') {
        document.getElementById('tab-quiz').classList.remove('hidden');
        document.getElementById('tab-wrong').classList.add('hidden');
        document.getElementById('wrong-btn-banner').classList.remove('hidden');
      } else {
        document.getElementById('tab-quiz').classList.add('hidden');
        document.getElementById('tab-wrong').classList.remove('hidden');
        document.getElementById('wrong-btn-banner').classList.add('hidden');
        renderWrongNotebook();
      }
    }

    function exportToPDF(elementId, filename) {
      const element = document.getElementById(elementId);
      const opt = {
        margin:       10,
        filename:     `${filename}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    function showStatus(msg, type = 'info') {
      const el = document.getElementById('status-msg');
      el.classList.remove('hidden', 'bg-blue-50', 'text-blue-800', 'bg-red-50', 'text-red-800', 'bg-green-50', 'text-green-800');
      
      if (type === 'error') el.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
      else if (type === 'success') el.classList.add('bg-green-50', 'text-green-800', 'border-green-200');
      else el.classList.add('bg-blue-50', 'text-blue-800', 'border-blue-200');
      
      el.innerText = msg;
    }
  </script>
