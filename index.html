<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>優華數位英文學習文法與閱讀刷題網</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f0fdf4; }
    .clickable-word {
      cursor: pointer;
      border-bottom: 1px dashed #6ee7b7;
      border-radius: 3px;
      padding: 0 2px;
      transition: all 0.15s ease;
    }
    .clickable-word:hover {
      background-color: #d1fae5;
      color: #065f46;
      border-bottom-color: #059669;
    }
    @media print {
      .no-print { display: none !important; }
      body { background-color: #ffffff; }
      .print-break { page-break-before: always; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between">
  <!-- 頂部導覽列 -->
  <header class="bg-emerald-700 text-white shadow-md no-print">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">📚</span>
        <h1 class="text-xl font-bold tracking-wide">優華數位英文學習與題庫網</h1>
      </div>
      <div id="user-status" class="text-sm bg-emerald-800 px-3 py-1 rounded-full hidden">
        使用者：<span id="current-user-email"></span>
      </div>
    </div>
  </header>

  <!-- 主畫面區塊 -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <!-- 登入畫面 -->
    <div id="login-section" class="max-w-md mx-auto bg-white rounded-xl shadow-md p-8 border border-emerald-100">
      <h2 class="text-2xl font-bold text-emerald-800 mb-6 text-center">學生 / 管理員登入</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">電子郵件 (Email)</label>
          <input type="email" id="login-email" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="請輸入 Email" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">密碼</label>
          <input type="password" id="login-password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="請輸入密碼" />
        </div>
        <button onclick="handleLogin()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition shadow-sm">
          立即登入
        </button>
        <p class="text-xs text-slate-400 text-center mt-2">提示：一般學生預設密碼為 123456</p>
      </div>
    </div>

    <!-- 刷題與測驗主介面 (登入後顯示) -->
    <div id="app-section" class="hidden space-y-6">
      <div class="bg-white rounded-xl shadow-md p-6 border border-emerald-100 flex justify-between items-center">
        <div>
          <h2 id="welcome-title" class="text-xl font-bold text-emerald-900">歡迎進入刷題系統</h2>
          <p class="text-sm text-slate-500">請選擇您的年級與題型開始練習</p>
        </div>
        <button onclick="handleLogout()" class="text-sm text-red-600 hover:text-red-800 font-medium px-3 py-1 border border-red-200 rounded-lg">登出</button>
      </div>

      <!-- 題庫載入與設定控制台 -->
      <div class="bg-white rounded-xl shadow-md p-6 border border-emerald-100 space-y-4">
        <h3 class="text-lg font-semibold text-emerald-800">📋 題庫篩選與設定</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Google Sheet 試算表 ID</label>
            <input type="text" id="sheet-id-input" value="11rFyQ1FLFflBAUzBoJGI2p8EChYSJWuje16DkZZdSWc" class="w-full px-3 py-2 border rounded-lg text-sm" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">工作表名稱</label>
            <input type="text" id="sheet-name-input" value="單字文法題庫" class="w-full px-3 py-2 border rounded-lg text-sm" />
          </div>
        </div>
        <button onclick="loadQuestionBank()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition shadow-sm">
          載入題庫資料
        </button>
      </div>

      <!-- 題目顯示區 -->
      <div id="quiz-container" class="bg-white rounded-xl shadow-md p-6 border border-emerald-100 hidden">
        <div id="question-content" class="space-y-4">
          <!-- 題目動態載入處 -->
        </div>
      </div>
    </div>
  </main>

  <!-- 頁尾 -->
  <footer class="bg-slate-100 text-center py-4 text-xs text-slate-500 border-t no-print">
    優華數位英文學習文法與閱讀刷題網 &copy; 2026
  </footer>

  <!-- 核心邏輯 JavaScript -->
  <script>
    function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      if (!email || !pass) {
        alert('請輸入帳號與密碼！');
        return;
      }
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
      document.getElementById('user-status').classList.remove('hidden');
      document.getElementById('current-user-email').innerText = email;
    }

    function handleLogout() {
      document.getElementById('app-section').classList.add('hidden');
      document.getElementById('login-section').classList.remove('hidden');
      document.getElementById('user-status').classList.add('hidden');
    }

    function loadQuestionBank() {
      const sheetId = document.getElementById('sheet-id-input').value.trim();
      const sheetName = document.getElementById('sheet-name-input').value.trim();
      alert(`準備從 Google Sheet ID: ${sheetId} 的工作表「${sheetName}」抓取資料 (欄位對應已就緒)！`);
    }
  </script>
</body>
</html>
